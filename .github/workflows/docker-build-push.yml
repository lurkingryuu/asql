name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Tag suffix (e.g., .cedar)'
        required: false
        default: '.cedar'
      platforms:
        description: 'Platforms to build (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  DOCKER_USERNAME: lurkingryuu
  IMAGE_NAME: mysql

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read MySQL version
        id: mysql_version
        run: |
          if [ -f "MYSQL_VERSION" ]; then
            source MYSQL_VERSION
            VERSION="${MYSQL_VERSION_MAJOR}.${MYSQL_VERSION_MINOR}.${MYSQL_VERSION_PATCH}${MYSQL_VERSION_EXTRA}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Determine tags
        id: tags
        run: |
          TAG_SUFFIX="${{ github.event.inputs.tag_suffix || '.cedar' }}"
          VERSION="${{ steps.mysql_version.outputs.version }}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Use the tag name directly
            FULL_TAG="${GITHUB_REF#refs/tags/}"
          else
            # Build version tag
            FULL_TAG="v${VERSION}${TAG_SUFFIX}"
          fi
          
          echo "full_tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "Tags: ${FULL_TAG}, latest"

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.full_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest: ${{ steps.meta.outputs.digest }}"

