version: '3.8'

services:
  cedar-ddl-audit:
    build: .
    container_name: cedar-ddl-audit-server
    ports:
      - "8180:8180"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const options = { host: 'localhost', port: 8180, path: '/health', timeout: 2000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cedar-network

networks:
  cedar-network:
    driver: bridge
